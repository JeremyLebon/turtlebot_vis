services:
  turtlebot-vis:
    build:
      context: ./
      dockerfile: docker/Dockerfile
    image: nobel86/turtlebot-rpi5-vis:zenoh  # new tag - keep :latest (cyclonedds) untouched until validated
    stdin_open: true
    network_mode: host
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTH}
      # Robot: automatisch gezocht in de container (robot_select.sh) - wie op
      # de wifi TB-AP-<nr> zit, krijgt robot <nr>. ROBOT_NR in .env = vast
      # nummer (enkel nodig als er meer dan één robot bereikbaar is).
      - ROBOT_NR=${ROBOT_NR:-}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      # Fallback middleware, kept for reference / easy rollback:
      #   RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///root/turtlebot3_ws/cylconedds_config.xml
      # Zenoh client config (ZENOH_CONFIG_OVERRIDE, unicast TCP naar de
      # Zenoh-router van de robot i.p.v. multicast scouting) wordt per
      # gekozen robot gezet door robot_select.sh.
 # Set a fancy prompt (See ~/.bashrc in the container)
      - TERM=xterm-256color

      # WSLg settings
      # https://www.reddit.com/r/bashonubuntuonwindows/comments/n2nthu/can_i_use_the_new_wslg_with_docker/
      - DISPLAY
      - WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR
      - PULSE_SERVER
    container_name: turtlebot-vis
    # Hoofdproces is een interactieve bash, die SIGTERM negeert: zonder dit
    # wacht `docker compose up` (andere robot -> nieuwe container) 10 s.
    stop_grace_period: 1s
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # WSLg settings
      - /mnt/wslg:/mnt/wslg
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Werkmap van de student (colcon-workspace): ./ros2_ws naast dit
      # bestand in WSL, in de container /root/ros2_ws. Overleeft het opnieuw
      # aanmaken van de container en is vanuit Windows/VS Code bereikbaar.
      # Zelfde naam als de werkmap op de robot (~/turtlebot_setup/ros2_ws).
      - ./ros2_ws:/root/ros2_ws
    command: bash
