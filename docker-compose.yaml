services:
  turtlebot-vis:
    build:
      context: ./
      dockerfile: docker/Dockerfile
    image: nobel86/turtlebot-rpi5-vis:zenoh  # new tag - keep :latest (cyclonedds) untouched until validated
    stdin_open: true
    network_mode: host
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=${XAUTH}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      # Fallback middleware, kept for reference / easy rollback:
      #   RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///root/turtlebot3_ws/cylconedds_config.xml
      # Zenoh client config: connect directly (unicast TCP) to the robot's
      # Zenoh router instead of relying on multicast scouting. DDS also
      # works over WSL2, but its multicast discovery generates noticeably
      # more network overhead - this is lighter, especially on constrained
      # wifi. ROBOT_ZENOH_IP is set in .env, one per robot you connect to.
      - ZENOH_CONFIG_OVERRIDE=mode="client";connect/endpoints=["tcp/${ROBOT_ZENOH_IP}:7447"]
 # Set a fancy prompt (See ~/.bashrc in the container)
      - TERM=xterm-256color

      # WSLg settings
      # https://www.reddit.com/r/bashonubuntuonwindows/comments/n2nthu/can_i_use_the_new_wslg_with_docker/
      - DISPLAY
      - WAYLAND_DISPLAY
      - XDG_RUNTIME_DIR
      - PULSE_SERVER
    container_name: turtlebot-vis
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
            # WSLg settings
      - /mnt/wslg:/mnt/wslg
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Werkmap van de student (colcon-workspace): ./ros2_ws naast dit
      # bestand in WSL, in de container /root/ros2_ws. Overleeft het opnieuw
      # aanmaken van de container en is vanuit Windows/VS Code bereikbaar.
      # Zelfde naam als de werkmap op de robot (~/turtlebot_setup/ros2_ws).
      - ./ros2_ws:/root/ros2_ws
    command: bash
